<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <title>みらい取締役会・監査統合基盤 WebUI</title>
    <meta name="description" content="みらい取締役会・監査統合基盤の企画・要件・設計・モックアップ・デモ・実装済みMVPを左メニューから閲覧できるWebUI" />
    <style>
      :root {
        --accent: #e08a2b;
        --accent-dark: #b96d1a;
        --border: #e3e8ef;
        --muted: #667085;
        --blue: #175cd3;
        --sidebar-bg: #16233b;
        --sidebar-fg: #dbe4f0;
        --sidebar-muted: #8fa1ba;
        --sidebar-active: #e08a2b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
        color: #1a2433;
        background: #eef1f5;
        display: flex;
        overflow: hidden;
      }
      a { text-decoration: none; }
      a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

      /* ── 左メニュー（サイドバー） ─────────────────────── */
      .sidebar {
        width: 250px;
        flex: 0 0 250px;
        background: var(--sidebar-bg);
        color: var(--sidebar-fg);
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: relative;
        z-index: 30;
      }
      .sidebar .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 1rem 1rem 0.9rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      .sidebar .brand .mark {
        width: 34px; height: 34px; border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), #f0b26a);
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 1.05rem; flex: 0 0 34px;
      }
      .sidebar .brand .title { font-weight: 700; font-size: 0.88rem; line-height: 1.35; color: #fff; }
      .sidebar .brand .sub { font-size: 0.68rem; color: var(--sidebar-muted); }
      .sidebar nav { flex: 1; overflow-y: auto; padding: 0.6rem 0.5rem; }
      .sidebar nav .menu-label {
        font-size: 0.66rem; letter-spacing: 0.08em; color: var(--sidebar-muted);
        padding: 0.5rem 0.7rem 0.3rem; text-transform: uppercase;
      }
      .sidebar nav a.item {
        display: flex; align-items: center; gap: 0.6rem;
        color: var(--sidebar-fg); font-size: 0.85rem;
        padding: 0.5rem 0.7rem; border-radius: 8px; margin: 1px 0;
      }
      .sidebar nav a.item:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
      .sidebar nav a.item.active { background: var(--sidebar-active); color: #fff; font-weight: 600; }
      .sidebar nav a.item .ico { width: 1.15rem; text-align: center; font-size: 0.95rem; }
      .sidebar nav a.item .ext { margin-left: auto; font-size: 0.62rem; color: var(--sidebar-muted); }
      .sidebar nav a.item.active .ext { color: rgba(255, 255, 255, 0.85); }
      .sidebar .s-foot {
        padding: 0.7rem 1rem; border-top: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 0.66rem; color: var(--sidebar-muted); line-height: 1.5;
      }

      /* ── 右コンテンツ（iframe） ─────────────────────── */
      .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .main .topbar {
        display: none;
        align-items: center; gap: 0.6rem;
        background: #fff; border-bottom: 1px solid var(--border);
        padding: 0.55rem 0.9rem; font-size: 0.85rem; font-weight: 600;
      }
      .main .topbar button {
        border: 1px solid var(--border); background: #fff; border-radius: 7px;
        font-size: 1rem; padding: 0.25rem 0.6rem; cursor: pointer; color: #1a2433;
      }
      .main .topbar button:hover { background: #f2f4f7; }
      .main iframe {
        flex: 1; width: 100%; border: 0; background: #fff;
      }

      /* ── モバイル対応 ─────────────────────────────── */
      @media (max-width: 880px) {
        body { overflow: hidden; }
        .sidebar {
          position: fixed; left: 0; top: 0; bottom: 0;
          transform: translateX(-100%);
          transition: transform 0.22s ease;
          box-shadow: 0 0 24px rgba(0, 0, 0, 0.25);
        }
        body.nav-open .sidebar { transform: translateX(0); }
        body.nav-open .scrim {
          position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 25;
        }
        .main .topbar { display: flex; }
      }
      .scrim { display: none; }
    </style>
  </head>
  <body>
    <aside class="sidebar" aria-label="メニュー">
      <div class="brand">
        <span class="mark" aria-hidden="true">🏛️</span>
        <div class="title">みらい取締役会・監査統合基盤
          <div class="sub">Board &amp; Audit Governance WebUI</div>
        </div>
      </div>
      <nav id="menu" aria-label="ドキュメントメニュー"></nav>
      <div class="s-foot">
        https://mbag.mirai-dx-platform.com<br />
        デモ用・架空データ
      </div>
    </aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <div class="main">
      <div class="topbar">
        <button id="menuBtn" type="button" aria-label="メニューを開く">☰</button>
        <span id="topTitle">みらい取締役会・監査統合基盤 WebUI</span>
      </div>
      <iframe id="content" title="コンテンツ" src="./%E4%BC%81%E7%94%BB%E6%9B%B8.html"></iframe>
    </div>

    <script>
      // 左メニュー項目（表示順は指示どおり）
      const MENU = [
        { label: "企画書", icon: "🗂️", src: "./%E4%BC%81%E7%94%BB%E6%9B%B8.html" },
        { label: "モックアップ", icon: "🖼️", src: "./mockup.html" },
        { label: "API概要", icon: "🔌", src: "./api.html" },
        { label: "GitHubリポジトリ", icon: "🔗", ext: "https://github.com/Kensan196948G/mirai-board-audit-governance" },
        { label: "要件定義書", icon: "📋", src: "./%E8%A6%81%E4%BB%B6%E5%AE%9A%E7%BE%A9%E6%9B%B8.html" },
        { label: "詳細仕様設計書", icon: "📐", src: "./%E8%A9%B3%E7%B4%B0%E4%BB%95%E6%A7%98%E8%A8%AD%E8%A8%88%E6%9B%B8.html" },
        { label: "要件対応表", icon: "✅", src: "./requirements.html" },
        { label: "デモガイド", icon: "🧭", src: "./guide.html" },
        { label: "実装済みMVPアプリ", icon: "🏗️", ext: "https://mbag-mvp.mirai-dx-platform.com/" },
        { label: "変更履歴", icon: "📝", src: "./history.html" },
      ];

      const frame = document.getElementById("content");
      const menu = document.getElementById("menu");
      const items = [];

      // メニュー描画
      const group = document.createElement("div");
      group.className = "menu-label";
      group.textContent = "ドキュメント";
      menu.appendChild(group);
      MENU.forEach((m) => {
        const a = document.createElement("a");
        a.className = "item";
        a.href = m.ext || m.src;
        if (m.ext) a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML = `<span class="ico">${m.icon}</span><span>${m.label}</span>${m.ext ? '<span class="ext">別タブ</span>' : ""}`;
        a.addEventListener("click", (e) => {
          if (m.ext) return; // 外部はそのまま別タブ
          e.preventDefault();
          select(m);
        });
        menu.appendChild(a);
        items.push({ el: a, item: m });
      });

      function select(m) {
        if (m.ext) {
          window.open(m.ext, "_blank", "noopener");
          return;
        }
        frame.src = m.src;
        location.hash = "#/" + encodeURIComponent(m.src.replace(/^\.\//, ""));
        items.forEach(({ el, item }) => el.classList.toggle("active", item === m));
        const label = items.find((x) => x.item === m)?.el?.querySelector("span:nth-child(2)")?.textContent || "";
        document.getElementById("topTitle").textContent = label || "みらい取締役会・監査統合基盤 WebUI";
        closeMenu();
      }

      function closeMenu() {
        document.body.classList.remove("nav-open");
      }
      document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
      document.getElementById("scrim").addEventListener("click", closeMenu);

      // ハッシュからの深いリンク（例: /#/mockup.html）
      function applyHash() {
        const h = location.hash.replace(/^#\//, "");
        if (!h) return;
        const m = MENU.find((x) => x.src && x.src.replace(/^\.\//, "") === decodeURIComponent(h));
        if (m) select(m);
      }
      window.addEventListener("hashchange", applyHash);

      // シェル自身がiframe内に読み込まれたら最上位へ戻す（入れ子防止）
      if (window.self !== window.top) {
        window.top.location.href = "/";
      } else {
        frame.addEventListener("load", () => {
          try {
            const p = frame.contentWindow.location.pathname;
            if (p === "/" || p.endsWith("/index.html")) {
              window.location.href = "/";
            }
          } catch { /* クロスオリジン時は無視 */ }
        });
        // 初期表示（既定: 企画書）をアクティブ表示
        const init = MENU.find((x) => x.src && x.src.includes("E4%BC%81%E7%94%BB"));
        if (init) items.forEach(({ el, item }) => el.classList.toggle("active", item === init));
        applyHash();
      }
    </script>
  </body>
</html>
